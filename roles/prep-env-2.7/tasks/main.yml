- name: Remove system/default execution environments
  ansible.builtin.set_fact:
    controller_execution_environments: >-
      {{
        controller_execution_environments | default([])
        | rejectattr('name', 'in', [
            'Hub Default execution environment',
            'Hub Minimal execution environment'
            'Default execution environment',
            'Minimal execution environment',
            'Control Plane Execution Environment',
            'Ansible Engine 2.9 execution environment',
            'Automation Hub Default execution environment'
          ])
        | list
      }}    
- name: Remove default instance group
  ansible.builtin.set_fact:
    controller_instance_groups: >-
      {{
        controller_instance_groups | default([])
        | rejectattr('name', 'equalto', 'default')
        | list
      }}

- name: Remove installer-managed policy fields from instance groups
  ansible.builtin.set_fact:
    controller_instance_groups: >-
      {{
        controller_instance_groups | default([])
        | map('dict2items')
        | map('rejectattr', 'key', 'in', [
            'policy_instance_percentage',
            'policy_instance_minimum',
            'policy_instance_list'
          ])
        | map('items2dict')
        | list
      }}

- name: Remove default system schedules
  ansible.builtin.set_fact:
    controller_schedules: >-
      {{
        controller_schedules | default([])
        | rejectattr('name', 'in', [
            'Cleanup Job Details',
            'Cleanup Activity Stream',
            'Cleanup Expired Sessions',
            'Cleanup Expired OAuth 2 Tokens'
          ])
        | list
      }}

- name: Check credential type data
  ansible.builtin.debug:
    var: controller_credential_types
