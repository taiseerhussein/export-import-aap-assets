---
controller_workflows:
  - name: "CONVERT2RHEL / 01 Analysis"
    description: !unsafe 'Workflow for Snapshot and Pre-conversion analysis of EL systems'
    organization: "Default"
    simplified_workflow_nodes:
      - identifier: "UTILITY / Clear yum cache"
        workflow_job_template: "CONVERT2RHEL / 01 Analysis"
        unified_job_template: "UTILITY / Clear yum cache"
        limit: ""
        organization: "Default"
        all_parents_must_converge: "False"
        success_nodes:
          - "UTILITY / Snapshot Instance"
      - identifier: "UTILITY / Snapshot Instance"
        workflow_job_template: "CONVERT2RHEL / 01 Analysis"
        unified_job_template: "UTILITY / Snapshot Instance"
        limit: ""
        organization: "Default"
        all_parents_must_converge: "False"
        success_nodes:
          - "OS / Pre-conversion Analysis"
      - identifier: "OS / Pre-conversion Analysis"
        workflow_job_template: "CONVERT2RHEL / 01 Analysis"
        unified_job_template: "OS / Pre-conversion Analysis"
        limit: ""
        organization: "Default"
        all_parents_must_converge: "False"
    ask_variables_on_launch: "True"
    allow_simultaneous: "False"
    scm_branch: ""
    limit: ""
    ask_limit_on_launch: true
    ask_inventory_on_launch: false
    webhook_service: ""
    extra_vars:
      org_id: Default_Organization
      convert_convert2rhel_opts: --no-rpm-va
      convert_reboot_requested: True
      lvm_snapshots_action: create
    survey_enabled: true
    survey_spec:
      name: ""
      spec:
        - type: multiplechoice
          choices:
            - !unsafe "CentOS7_Dev"
            - !unsafe "CentOS7_QA"
            - !unsafe "CentOS7_Prod"
            - !unsafe "OL7_Dev"
            - !unsafe "OL7_QA"
            - !unsafe "OL7_Prod"
          required: True
          variable: dynamic_inventory_group
          question_name: !unsafe "Select EL Group to analyze"
          question_description: !unsafe "Use to limit job to hosts that are members of the selected host group."
      description: ""
  - name: "CONVERT2RHEL / 02 Convert"
    description: !unsafe 'Workflow for Snapshot and Conversion of EL systems'
    organization: "Default"
    simplified_workflow_nodes:
      - identifier: "UTILITY / Clear yum cache"
        workflow_job_template: "CONVERT2RHEL / 02 Convert"
        unified_job_template: "UTILITY / Clear yum cache"
