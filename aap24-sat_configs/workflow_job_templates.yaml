        organization: "Default"
        all_parents_must_converge: "False"
        success_nodes:
          - "UTILITY / Snapshot Instance"
      - identifier: "UTILITY / Snapshot Instance"
        workflow_job_template: "CONVERT2RHEL / 02 Convert"
        unified_job_template: "UTILITY / Snapshot Instance"
        limit: ""
        organization: "Default"
        all_parents_must_converge: "False"
        success_nodes:
          - "OS / Convert to RHEL7"
      - identifier: "OS / Convert to RHEL7"
        workflow_job_template: "CONVERT2RHEL / 02 Convert"
        unified_job_template: "OS / Convert to RHEL7"
        limit: ""
        organization: "Default"
        all_parents_must_converge: "False"
    ask_variables_on_launch: "True"
    allow_simultaneous: "False"
    scm_branch: ""
    limit: ""
    ask_limit_on_launch: true
    ask_inventory_on_launch: false
    webhook_service: ""
    extra_vars:
      org_id: Default_Organization
      convert_convert2rhel_opts: --no-rpm-va
      convert_convert2rhel_env_vars: {'CONVERT2RHEL_INCOMPLETE_ROLLBACK': 1, 'CONVERT2RHEL_OUTDATED_PACKAGE_CHECK_SKIP': 1, 'CONVERT2RHEL_ALLOW_OLDER_VERSION': 1}
      convert_reboot_requested: True
      lvm_snapshots_action: create
    survey_enabled: true
    survey_spec:
      name: ""
      spec:
        - type: multiplechoice
          choices:
            - !unsafe "CentOS7_Dev"
            - !unsafe "CentOS7_QA"
            - !unsafe "CentOS7_Prod"
            - !unsafe "OL7_Dev"
            - !unsafe "OL7_QA"
            - !unsafe "OL7_Prod"
          required: True
          variable: dynamic_inventory_group
          question_name: !unsafe "Select EL Group to convert"
          question_description: !unsafe "Use to limit job to hosts that are members of the selected host group."
      description: ""
  - name: "CONVERT2RHEL / 03 Rollback"
